services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: factory
      MYSQL_USER: factory
      MYSQL_PASSWORD: factory
      MYSQL_ROOT_PASSWORD: factory
    ports:
      - "3306:3306"
    volumes:
      - factory_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ufactory", "-pfactory"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  factory_mysql:
